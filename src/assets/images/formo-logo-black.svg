<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <g id="icon" transform="translate(148, 8) scale(1)">
    <!--
      The icon is a square border with FM letterforms inside.
      Square outer: 204x204, stroke ~22px thick
      The F occupies the left portion, M the right.
      Bottom section has architectural grid lines.
    -->

    <!-- Square border (4 bars forming the frame) -->
    <!-- Top -->
    <rect x="0"   y="0"   width="204" height="22" fill="#1a1a1a"/>
    <!-- Left -->
    <rect x="0"   y="0"   width="22"  height="204" fill="#1a1a1a"/>
    <!-- Bottom -->
    <rect x="0"   y="182" width="204" height="22" fill="#1a1a1a"/>
    <!-- Right -->
    <rect x="182" y="0"   width="22"  height="204" fill="#1a1a1a"/>

    <!-- ===== F LETTER (left half) ===== -->
    <!-- F vertical stem: x=28, from y=28 down to y=155 -->
    <rect x="28" y="28" width="24" height="127" fill="#1a1a1a"/>
    <!-- F top horizontal bar: from stem to ~x=105 -->
    <rect x="28" y="28" width="78" height="22" fill="#1a1a1a"/>
    <!-- F middle horizontal bar: shorter, ~x=90 -->
    <rect x="28" y="78" width="62" height="20" fill="#1a1a1a"/>

    <!-- ===== M LETTER (right half) ===== -->
    <!-- M left stem -->
    <rect x="108" y="28" width="22" height="127" fill="#1a1a1a"/>
    <!-- M right stem -->
    <rect x="154" y="28" width="22" height="127" fill="#1a1a1a"/>
    <!-- M left peak diagonal (left stem top → center peak) -->
    <!-- Using a parallelogram: top-left corner at (108,28), goes to center -->
    <polygon points="108,28 130,28 145,75 123,75" fill="#1a1a1a"/>
    <!-- M right peak diagonal (center → right stem top) -->
    <polygon points="145,75 168,75 176,28 154,28" fill="#1a1a1a"/>

    <!-- ===== BOTTOM ARCHITECTURAL GRID (floor plan detail) ===== -->
    <!-- Main horizontal band -->
    <rect x="28"  y="152" width="148" height="12" fill="#1a1a1a"/>
    <!-- Second horizontal band -->
    <rect x="80"  y="168" width="96"  height="12" fill="#1a1a1a"/>
    <!-- Short vertical connector left of second band -->
    <rect x="80"  y="152" width="12"  height="28" fill="#1a1a1a"/>
    <!-- Short vertical connector in middle -->
    <rect x="118" y="152" width="12"  height="28" fill="#1a1a1a"/>
  </g>

  <!-- ===== FORMO WORDMARK ===== -->
  <!-- Using a geometric, rounded heavy sans-serif approximation via SVG text -->
  <text
    x="250" y="300"
    font-family="'Futura PT', 'Futura', 'Century Gothic', 'Gill Sans', sans-serif"
    font-size="112"
    font-weight="900"
    letter-spacing="1"
    text-anchor="middle"
    fill="#1a1a1a"
  >FORMO</text>

  <!-- ===== TAGLINE ===== -->
  <text
    x="250" y="348"
    font-family="'Futura PT', 'Futura', 'Century Gothic', 'Gill Sans', sans-serif"
    font-size="17"
    font-weight="300"
    letter-spacing="5.5"
    text-anchor="middle"
    fill="#1a1a1a"
  >RENOVATION &amp; INTERIOR FINISHING</text>
</svg>
